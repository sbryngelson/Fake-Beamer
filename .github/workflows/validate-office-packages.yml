name: Validate Office packages

on:
  push:
  pull_request:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils perl coreutils shellcheck

      - name: Lint shell scripts
        run: shellcheck scripts/inspect-office-files.sh

      - name: Inspect OOXML packages
        run: scripts/inspect-office-files.sh

      - name: Check repository invariants
        run: scripts/inspect-office-files.sh --check
